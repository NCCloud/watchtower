apiVersion: cloud.spaceship.com/v1alpha1
kind: Watcher
metadata:
  name: advanced-watcher
spec:
  source:
    apiVersion: "apps/v1"
    kind: "Deployment"
    concurrency: 1
    options:
      onSuccess:
        deleteObject: true
  filter:
    # CEL boolean evaluated on Create events.
    # Bindings: object, now.
    # First clause is the restart-safety guard (replaces the old creationTimeout).
    create: |
      now - timestamp(object.metadata.creationTimestamp) < duration('1h') &&
      object.metadata.name.matches('.*website.*') &&
      object.metadata.namespace.matches('customer-namespace.*') &&
      object.metadata.labels['foo'] == 'bar' &&
      object.metadata.annotations['baz'] == 'qux'
    # CEL boolean evaluated on Update events.
    # Bindings: object, oldObject, now.
    update: |
      object.metadata.name.matches('.*website.*') &&
      object.metadata.namespace.matches('customer-namespace.*') &&
      object.metadata.labels['foo'] == 'bar' &&
      (object.status.readyReplicas != oldObject.status.readyReplicas ||
       object.spec.replicas != oldObject.spec.replicas)
  destination:
    urlTemplate: "http://test.com/{{ .spec.Id }}"
    method: "POST"
    timeout: "10s"
    bodyTemplate: |
      {
        "text": "{{ .metadata.name }}"
      }
    headers:
      Content-Type: "application/json"
      app_ctx: "{{ .metadata.labels.app_context }}"
  valuesFrom:
    secrets:
      - key: "foo"
        name: "test"
        namespace: "default"
